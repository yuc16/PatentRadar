[project]
name = "patentradar"
version = "2.0"
description = "专利侵权线索挖掘系统 v2"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "json-repair>=0.60.1",
    "jsonschema>=4.26.0",
    "lxml>=6.1.0",
    "markdown>=3.10.2",
    "nh3>=0.3.5",
    "openai>=2.33.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.3",
    "pymupdf>=1.27.2.3",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "typer>=0.25.1",
    "uvicorn[standard]>=0.46.0",
    "weasyprint>=68.1",
]

[project.scripts]
patentradar = "patentradar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patentradar"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

