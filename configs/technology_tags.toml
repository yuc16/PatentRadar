# 模块一 decompose 用到的 9 个技术领域标签。
#
# src 端用法：
#   - patentradar.core.constants 在 import 时从本份加载，导出 TECHNOLOGY_TAGS
#   - llm/prompts/decompose.md 里 {{TECHNOLOGY_TAGS_DESCRIPTIONS}} 占位符
#   - llm/workers/decompose_worker 的 json schema enum
#
# 字段说明：
#   name              ：技术领域标签名（中文），模块一选其一作为 technology_tag
#   description       ：领域描述，帮助 LLM 判断专利归类
#   typical_objects   ：典型保护对象示例
#   recommended_sites ：该 tag 下推荐的垂类证据来源网站（每条 url + description）
#                       模块二/三 agent 应优先在这些站点检索该领域竞品证据
#
# 顶层 [[universal_sites]] 列出**所有 tag 通用**的证据网站（如车型维修手册站、
# 全行业拆解站等），模块二/三 agent 不论专利属于哪个 tag 都应在这些站点检索。

[[tags]]
name = "动力电池"
description = "以电芯、电池模组、电池包、BMS、电池安全、电池热管理为核心对象。"
typical_objects = ["单体电池", "电池包", "刀片电池", "泄压结构", "液冷板", "BMS"]
recommended_sites = [
    { url = "https://batteryfinds.com", description = "电池行业垂类社区，汇集电芯/PACK 厂商规格书、拆解报告、型号对比、容量/能量/尺寸参数；查具体电芯型号尺寸、能量密度等数值证据时优先用" },
]

[[tags]]
name = "电驱系统"
description = "以驱动电机、电机控制器、减速器、电驱桥、动力总成为核心对象。"
typical_objects = ["电机", "电控", "减速器", "驱动桥", "四驱控制"]

[[tags]]
name = "充配电系统"
description = "以充电、放电、配电、高压电气、车载电源变换为核心对象。"
typical_objects = ["OBC", "DC/DC", "V2L", "V2G", "充电口", "高压配电盒"]

[[tags]]
name = "整车与车身底盘"
description = "以整车结构、车身、底盘、悬架、制动、转向、车门、尾门、座椅等车辆机械结构为核心对象。"
typical_objects = ["车身结构", "车门", "尾门", "座椅", "底盘", "悬架", "制动"]

[[tags]]
name = "智能驾驶"
description = "以感知、决策、规划、控制、泊车、辅助驾驶为核心对象。"
typical_objects = ["摄像头感知", "雷达融合", "自动泊车", "ADAS 控制"]

[[tags]]
name = "智能座舱与车联网"
description = "以车机、座舱交互、语音、显示、车联网、远程控制为核心对象。"
typical_objects = ["语音助手", "车机系统", "屏幕交互", "OTA", "远程控车"]

[[tags]]
name = "制造工艺与装备"
description = "以生产制造过程、装配工艺、焊接、涂布、检测设备、生产线为核心对象。"
typical_objects = ["电池制造", "焊接工艺", "涂胶工艺", "装配设备", "检测装置"]

[[tags]]
name = "材料与化学"
description = "以材料组成、配方、涂层、电解液、正负极材料、复合材料为核心对象。"
typical_objects = ["电池材料", "导热材料", "阻燃材料", "密封材料", "复合材料"]

[[tags]]
name = "其他"
description = "确认权利要求 1 核心保护对象确实不属于前 8 类时才选。"
typical_objects = []

