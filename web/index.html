<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PatentRadar Dashboard</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <span class="logo">●</span>
      <div class="brand-text">
        <div class="title">PatentRadar</div>
        <div class="subtitle">专利侵权竞品分析</div>
      </div>
    </div>

    <form id="run-form" class="run-form">
      <input
        id="pub-input"
        type="text"
        placeholder="CN114512759B"
        autocomplete="off"
        spellcheck="false"
      />
      <button type="submit" id="run-btn">开始分析</button>
    </form>

    <button id="replay-btn" class="replay-trigger-btn" hidden>↺ 回看本次</button>

    <div class="modules-section">
      <div class="section-label">模块进度</div>
      <ul class="modules-list">
        <li class="module-item pending" data-module="1">
          <span class="status-dot"></span>
          <span class="module-name">模块 1 · 拆解</span>
          <span class="module-elapsed"></span>
        </li>
        <li class="module-item pending" data-module="2">
          <span class="status-dot"></span>
          <span class="module-name">模块 2 · 竞品搜索</span>
          <span class="module-elapsed"></span>
        </li>
        <li class="module-item pending" data-module="3">
          <span class="status-dot"></span>
          <span class="module-name">模块 3 · 全 claim</span>
          <span class="module-elapsed"></span>
        </li>
        <li class="module-item pending" data-module="4">
          <span class="status-dot"></span>
          <span class="module-name">模块 4 · 报告</span>
          <span class="module-elapsed"></span>
        </li>
      </ul>
    </div>

    <div class="outputs-section" id="outputs-section" hidden>
      <div class="section-label">输出文件</div>
      <ul class="outputs-list" id="outputs-list"></ul>
    </div>

    <div class="footer-meta" id="pipeline-status">空闲</div>
  </aside>

  <main class="stage">
    <header class="stage-header">
      <div class="stage-title">
        <span class="status-dot" id="stage-dot"></span>
        <h2 id="stage-title">等待启动</h2>
      </div>
      <div class="stage-meta">
        <span id="stage-elapsed"></span>
        <button id="follow-btn" class="follow-btn active" title="自动滚到底">⤓ 自动跟随</button>
      </div>
    </header>

    <section class="replay-bar" id="replay-bar" hidden>
      <div class="replay-controls">
        <button id="replay-toggle" class="replay-btn" title="播放/暂停">▶</button>
        <div class="speed-group" role="group" aria-label="播放速度">
          <button class="speed-btn active" data-speed="1">1x</button>
          <button class="speed-btn" data-speed="20">20x</button>
          <button class="speed-btn" data-speed="100">100x</button>
          <button class="speed-btn" data-speed="600">600x</button>
        </div>
        <button id="export-replay-btn" class="export-btn" title="导出为离线 html, 可永久保存/分享">⬇ 导出</button>
      </div>
      <div class="replay-progress">
        <div class="progress-bar" id="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
          <div class="progress-thumb" id="progress-thumb"></div>
        </div>
        <span class="progress-time" id="progress-time">00:00 / 00:00</span>
      </div>
    </section>

    <section class="stage-summary" id="stage-summary" hidden></section>

    <section class="stage-log" id="stage-log">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">◔</div>
        <div class="empty-text">输入专利公开号开始分析</div>
        <div class="empty-hint">例如 <code>CN114512759B</code></div>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
