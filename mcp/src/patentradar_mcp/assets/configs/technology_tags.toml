# 模块一 decompose 用到的 9 个技术领域标签。
#
# src 端用法：
#   - patentradar.core.constants 在 import 时从本份加载，导出 TECHNOLOGY_TAGS
#   - llm/prompts/decompose.md 里 {{TECHNOLOGY_TAGS_DESCRIPTIONS}} 占位符
#   - llm/workers/decompose_worker 的 json schema enum
#   - fetcher/web_fetcher 抓 HTML 嵌图时根据 image_boost_keywords 做 score 启发式加分
#
# 字段说明：
#   name              ：技术领域标签名（中文），模块一选其一作为 technology_tag
#   description       ：领域描述，帮助 LLM 判断专利归类
#   typical_objects   ：典型保护对象示例（仅模块一 decompose prompt 用作 LLM 分类参考；
#                       模块二/三/四不用）
#   recommended_sites ：该 tag 下推荐的垂类证据来源网站（每条 url + description）
#                       模块二/三 agent 应优先在这些站点检索该领域竞品证据
#   image_boost_keywords：该 tag 下用于 HTML 抓图 score 启发式加分的领域关键词；
#                       fetcher 抓到 <img> 时根据 URL 路径 / alt / 周围文字命中这些词决定加分
#                       · path_strong_boost: URL 路径含这些片段 +3（强信号，显式专题路径）
#                       · path_boost       : URL 路径 / alt / 周围文字含这些词 +2（普通信号）
#                       · alt_blacklist    : 命中这些词的图直接丢（该领域典型噪音词）
#                       同一 tag 没有显式配置时退回到顶层 [default_image_boost_keywords]
#
# 顶层 [[universal_sites]] 列出**所有 tag 通用**的证据网站。
# 顶层 [default_image_boost_keywords] 是所有 tag 兜底共用的图像加分词。

[[tags]]
name = "动力电池"
description = "以电芯、电池模组、电池包、BMS、电池安全、电池热管理为核心对象。"
typical_objects = ["单体电池", "电池包", "刀片电池", "泄压结构", "液冷板", "BMS"]
recommended_sites = [
    { url = "https://batteryfinds.com", description = "电池行业垂类社区，汇集电芯/PACK 厂商规格书、拆解报告、型号对比、容量/能量/尺寸参数；查具体电芯型号尺寸、能量密度等数值证据时优先用" },
]
[tags.image_boost_keywords]
path_strong_boost = ["/cell/", "/pack/", "/battery/", "/bms/", "/teardown/", "/datasheet/"]
path_boost = [
    "cell", "pack", "battery", "module", "bms", "datasheet", "teardown",
    "anode", "cathode", "电池", "电芯", "模组", "规格", "尺寸", "拆解", "极耳", "防爆阀",
]

