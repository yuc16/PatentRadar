# 此 tag 走顶层 default_image_boost_keywords 兜底

# ============================================================================
# 默认（兜底）图像 score 启发式加分词
# 任何 tag 没显式配 image_boost_keywords 时使用本份；与 tag 专属词不叠加，二选一
# ============================================================================

[default_image_boost_keywords]
path_strong_boost = ["/product/", "/products/", "/datasheet/", "/spec/", "/specs/", "/teardown/"]
path_boost = [
    "spec", "specification", "datasheet", "detail", "details", "gallery",
    "teardown", "diagram", "figure", "schematic",
    "规格", "尺寸", "拆解", "产品",
]
# alt_blacklist 不在 default 里——全局共用的 alt_blacklist 写在 web_fetcher.py 常量里

